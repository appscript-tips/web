<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Postingan Publik</title>
  <style>
    /* ========================================= */
    /* ROOT & GLOBAL STYLES                      */
    /* ========================================= */
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius: 20px;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .page-title {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 40px;
      background: linear-gradient(135deg, var(--primary), #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ========================================= */
    /* GRID & CARD STYLES                        */
    /* ========================================= */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      border: 1px solid #f1f5f9;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(79, 70, 229, 0.15);
    }
    
    .card-thumb-container {
      width: 100%;
      height: 220px;
      overflow: hidden;
      position: relative;
      background: #e2e8f0;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
    }
    .card:hover .card-thumb {
      transform: scale(1.08);
    }
    .category-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 15px 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-action-text {
      margin-top: auto;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ========================================= */
    /* LOAD MORE BUTTON                          */
    /* ========================================= */
    .load-more-container {
      text-align: center;
      margin-top: 50px;
    }
    .btn-load-more {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(79,70,229,0.1);
    }
    .btn-load-more:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    /* ========================================= */
    /* FULL SCREEN MODAL                         */
    /* ========================================= */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--card-bg);
      z-index: 9999;
      display: none;
      overflow-y: auto;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal.show {
      display: block;
      animation: modalFadeIn 0.4s forwards;
    }
    @keyframes modalFadeIn {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    /* Tombol Silang Tetap Menempel (Fixed) */
    .modal-close {
      position: fixed;
      top: 20px; right: 20px;
      background: rgba(15, 23, 42, 0.75);
      color: white;
      border: none;
      width: 45px; height: 45px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      z-index: 10000;
      backdrop-filter: blur(5px);
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .modal-close:hover {
      background: #ef4444;
      transform: rotate(90deg) scale(1.1);
    }

    .modal-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* ========================================= */
    /* SLIDESHOW & THUMBNAILS                    */
    /* ========================================= */
    .slideshow-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 20px;
    }
    
    .slide-main-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background: #e2e8f0;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    }
    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .slide-img.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Tombol Panah Next / Prev */
    .slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.6);
      color: white;
      border: none;
      width: 45px; height: 45px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
      z-index: 10;
    }
    .slide-btn:hover { background: var(--primary); transform: translateY(-50%) scale(1.1); }
    .slide-prev { left: 15px; }
    .slide-next { right: 15px; }

    /* Kotak-kotak Kecil Preview Thumbnail */
    .thumbnail-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 30px;
      scrollbar-width: thin;
    }
    .thumb-item {
      width: 75px;
      height: 55px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      opacity: 0.6;
      transition: all 0.2s;
      flex-shrink: 0;
      background: #e2e8f0;
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-item:hover { opacity: 0.9; }
    .thumb-item.active {
      border-color: var(--primary);
      opacity: 1;
      transform: scale(1.05);
    }

    .modal-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .modal-desc {
      font-size: 1.1rem;
      color: #334155;
      line-height: 1.8;
      white-space: pre-line;
      margin-bottom: 40px;
    }
    .modal-link {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      color: white;
      text-decoration: none;
      padding: 15px 35px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 10px 20px rgba(79,70,229,0.3);
      transition: all 0.3s;
    }
    .modal-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(79,70,229,0.4);
    }
    
    .loading-state { text-align: center; padding: 50px; color: var(--text-muted); font-size: 1.2rem; }
  </style>
</head>
<body>

<div class="container">
  <h1 class="page-title">Beranda Postingan</h1>
  
  <div class="grid" id="postsGrid">
    <div class="loading-state">⏳ Sedang memuat data terbaru...</div>
  </div>

  <div class="load-more-container" id="loadMoreContainer" style="display: none;">
    <button class="btn-load-more" onclick="loadMorePosts()">↓ Muat Lebih Banyak</button>
  </div>
</div>

<!-- ========================================= -->
<!-- MODAL FULL SCREEN (FIXED CLOSE BUTTON)    -->
<!-- ========================================= -->
<div class="modal" id="postModal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-content">
    
    <!-- Slideshow Utama & Tombol Next/Prev -->
    <div class="slideshow-wrapper" id="slideshowWrapper" style="display: none;">
      <div class="slide-main-container" id="slideMainContainer"></div>
      <button class="slide-btn slide-prev" onclick="changeSlide(-1)">❮</button>
      <button class="slide-btn slide-next" onclick="changeSlide(1)">❯</button>
    </div>

    <!-- Thumbnail Kotak Kecil di Bawah -->
    <div class="thumbnail-list" id="thumbnailList"></div>
    
    <h1 class="modal-title" id="modalTitle"></h1>
    <div class="modal-desc" id="modalDesc"></div>
    
    <a href="#" target="_blank" class="modal-link" id="modalLink" style="display: none;">🔗 Kunjungi Tautan</a>
  </div>
</div>

<script>
  let allPosts = [];
  let currentDisplayed = 0;
  const postsPerLoad = 9;
  
  // Variabel untuk melacak status slideshow aktif
  let currentImages = [];
  let currentSlideIndex = 0;

  window.addEventListener('DOMContentLoaded', () => { fetchData(); });

  async function fetchData() {
    try {
      const response = await fetch('./posts.json');
      if (!response.ok) throw new Error("File tidak ditemukan.");
      
      const data = await response.json();
      allPosts = data.posts || data;

      document.getElementById('postsGrid').innerHTML = "";
      if (allPosts.length === 0) {
        document.getElementById('postsGrid').innerHTML = "<div class='loading-state'>Belum ada postingan.</div>";
        return;
      }
      loadMorePosts();
    } catch (error) {
      console.error(error);
      document.getElementById('postsGrid').innerHTML = "<div class='loading-state'>Gagal memuat data.</div>";
    }
  }

  function loadMorePosts() {
    const grid = document.getElementById('postsGrid');
    const end = Math.min(currentDisplayed + postsPerLoad, allPosts.length);

    for (let i = currentDisplayed; i < end; i++) {
      const post = allPosts[i];
      const images = (post.gambar || "").split(',').map(s => s.trim()).filter(s => s !== "");
      const thumbnailSrc = images.length > 0 ? images[0] : "https://via.placeholder.com/600x400/e2e8f0/64748b?text=Tanpa+Gambar";
      const kategoriText = post.kategori || "Uncategorized";

      const cardHtml = `
        <div class="card" onclick="openModal(${i})">
          <div class="card-thumb-container">
            <span class="category-badge">${kategoriText}</span>
            <img src="${thumbnailSrc}" class="card-thumb" alt="Thumbnail" loading="lazy">
          </div>
          <div class="card-content">
            <h3 class="card-title">${post.judul}</h3>
            <span class="card-action-text">Klik untuk lihat detail <span>→</span></span>
          </div>
        </div>
      `;
      grid.insertAdjacentHTML('beforeend', cardHtml);
    }

    currentDisplayed = end;
    document.getElementById('loadMoreContainer').style.display = (currentDisplayed >= allPosts.length) ? 'none' : 'block';
  }

  // ==========================================
  // LOGIKA SLIDESHOW & THUMBNAIL
  // ==========================================
  
  function openModal(index) {
    const post = allPosts[index];
    const modal = document.getElementById('postModal');
    
    currentImages = (post.gambar || "").split(',').map(s => s.trim()).filter(s => s !== "");
    currentSlideIndex = 0;

    const wrapper = document.getElementById('slideshowWrapper');
    const mainContainer = document.getElementById('slideMainContainer');
    const thumbList = document.getElementById('thumbnailList');
    const prevBtn = document.querySelector('.slide-prev');
    const nextBtn = document.querySelector('.slide-next');

    mainContainer.innerHTML = "";
    thumbList.innerHTML = "";

    if (currentImages.length > 0) {
      wrapper.style.display = "block";
      
      // Sembunyikan tombol panah jika gambar cuma 1
      if (currentImages.length <= 1) {
        prevBtn.style.display = "none";
        nextBtn.style.display = "none";
      } else {
        prevBtn.style.display = "flex";
        nextBtn.style.display = "flex";
      }

      // Render gambar utama & thumbnail kecil
      currentImages.forEach((imgUrl, i) => {
        // Main slide image
        mainContainer.innerHTML += `<img src="${imgUrl}" class="slide-img ${i === 0 ? 'active' : ''}" id="slideImg_${i}">`;
        
        // Thumbnail kotak kecil
        thumbList.innerHTML += `
          <div class="thumb-item ${i === 0 ? 'active' : ''}" id="thumb_${i}" onclick="goToSlide(${i})">
            <img src="${imgUrl}" loading="lazy">
          </div>
        `;
      });
      thumbList.style.display = "flex";
    } else {
      wrapper.style.display = "none";
      thumbList.style.display = "none";
    }

    document.getElementById('modalTitle').innerText = post.judul;
    document.getElementById('modalDesc').innerText = post.konten;
    
    const linkBtn = document.getElementById('modalLink');
    if (post.customLink && post.customLink.trim() !== "") {
      linkBtn.href = post.customLink;
      linkBtn.style.display = "inline-block";
    } else {
      linkBtn.style.display = "none";
    }

    modal.classList.add('show');
    document.body.style.overflow = "hidden";
  }

  function changeSlide(direction) {
    currentSlideIndex += direction;
    if (currentSlideIndex < 0) {
      currentSlideIndex = currentImages.length - 1; // Putar ke gambar terakhir
    } else if (currentSlideIndex >= currentImages.length) {
      currentSlideIndex = 0; // Putar balik ke gambar pertama
    }
    updateSlideActiveState();
  }

  function goToSlide(index) {
    currentSlideIndex = index;
    updateSlideActiveState();
  }

  function updateSlideActiveState() {
    for (let i = 0; i < currentImages.length; i++) {
      const imgElem = document.getElementById(`slideImg_${i}`);
      const thumbElem = document.getElementById(`thumb_${i}`);
      
      if (i === currentSlideIndex) {
        imgElem.classList.add('active');
        thumbElem.classList.add('active');
        // Pastikan thumbnail yang aktif ikut bergeser ke tengah pandangan
        thumbElem.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
      } else {
        imgElem.classList.remove('active');
        thumbElem.classList.remove('active');
      }
    }
  }

  function closeModal() {
    const modal = document.getElementById('postModal');
    modal.classList.remove('show');
    document.body.style.overflow = "auto";
  }
</script>
</body>
</html>
