<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Postingan Publik</title>
  <style>
    /* Styling dasar atau masukkan CSS aslimu di sini */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e2e8f0; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    .clean-card-box { background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    h2 { margin-top: 0; color: #0f172a; }
    img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
    .loading { text-align: center; color: #64748b; font-weight: 500; padding: 40px; }
  </style>
</head>
<body>

<div class="container">
  <h1 style="text-align: center; color: #0f172a; margin-bottom: 24px;">📰 Portal Berita & Postingan</h1>
  
  <!-- Area tempat postingan akan dirender otomatis -->
  <div id="postsContainer">
    <div class="loading">⏳ Memuat postingan terbaru dari server...</div>
  </div>
</div>

<script>
  async function loadPublicPosts() {
    try {
      // Mengambil file posts.json secara lokal dari server GitHub Pages
      const response = await fetch('./posts.json');
      
      if (!response.ok) {
        throw new Error("File posts.json belum ditemukan.");
      }

      const posts = await response.json();
      const container = document.getElementById('postsContainer');

      if (!posts || posts.length === 0) {
        container.innerHTML = '<div class="clean-card-box"><p style="text-align:center; margin:0;">Belum ada postingan yang dipublikasikan.</p></div>';
        return;
      }

      let htmlOutput = "";

      posts.forEach(post => {
        // Jika ada gambar, buat tag img. Jika tidak ada, kosongkan.
        let imageHTML = post.gambar ? `<img src="${post.gambar}" alt="Gambar Postingan">` : "";
        
        // Format tanggal agar rapi dibaca
        let tanggalRapi = post.tanggal ? new Date(post.tanggal).toLocaleDateString('id-ID', { dateStyle: 'medium' }) : "";

        htmlOutput += `
          <div class="clean-card-box">
            ${imageHTML}
            <h2>${post.judul}</h2>
            <p style="color: #475569; line-height: 1.5; white-space: pre-line;">${post.konten}</p>
            <span style="font-size: 0.75rem; color: #94a3b8; display: block; margin-top: 12px;">Dipublikasikan: ${tanggalRapi}</span>
          </div>
        `;
      });

      container.innerHTML = htmlOutput;

    } catch (error) {
      console.error("Gagal meload postingan:", error);
      document.getElementById('postsContainer').innerHTML = `
        <div class="clean-card-box" style="border-left: 4px solid #ef4444;">
          <h2 style="color: #ef4444;">Belum Ada Postingan</h2>
          <p>Silakan buat postingan pertama melalui panel admin Google Apps Script kamu agar file posts.json otomatis terbentuk.</p>
        </div>
      `;
    }
  }

  // Jalankan saat halaman dibuka
  window.addEventListener('DOMContentLoaded', () => {
    loadPublicPosts();
  });
</script>

</body>
</html>
