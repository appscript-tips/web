<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Postingan Publik</title>
  <style>
    /* ========================================= */
    /* ROOT & GLOBAL STYLES                      */
    /* ========================================= */
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius: 20px;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .page-title {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 40px;
      background: linear-gradient(135deg, var(--primary), #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ========================================= */
    /* GRID & CARD STYLES                        */
    /* ========================================= */
    .grid {
      display: grid;
      grid-template-columns: 1fr; /* Default 1 kolom untuk HP */
      gap: 30px;
    }
    /* Tablet: 2 Kolom */
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    /* Komputer: 3 Kolom */
    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      border: 1px solid #f1f5f9;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(79, 70, 229, 0.15);
    }
    
    .card-thumb-container {
      width: 100%;
      height: 220px;
      overflow: hidden;
      position: relative;
      background: #e2e8f0;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
    }
    .card:hover .card-thumb {
      transform: scale(1.08);
    }
    .category-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 15px 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-action-text {
      margin-top: auto;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ========================================= */
    /* LOAD MORE BUTTON                          */
    /* ========================================= */
    .load-more-container {
      text-align: center;
      margin-top: 50px;
    }
    .btn-load-more {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(79,70,229,0.1);
    }
    .btn-load-more:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    /* ========================================= */
    /* FULL SCREEN MODAL                         */
    /* ========================================= */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--card-bg);
      z-index: 9999;
      display: none;
      overflow-y: auto;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal.show {
      display: block;
      animation: modalFadeIn 0.4s forwards;
    }
    @keyframes modalFadeIn {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    .modal-close {
      position: fixed;
      top: 20px; right: 20px;
      background: rgba(0,0,0,0.1);
      border: none;
      width: 45px; height: 45px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      z-index: 10000;
      backdrop-filter: blur(5px);
      transition: all 0.2s;
    }
    .modal-close:hover {
      background: var(--danger, #ef4444);
      color: white;
      transform: rotate(90deg);
    }

    .modal-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* Wide Slider */
    .slider-container {
      width: 100%;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 15px;
      padding-bottom: 10px;
      margin-bottom: 30px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) #e2e8f0;
    }
    .slider-container::-webkit-scrollbar { height: 8px; }
    .slider-container::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
    .slider-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    
    .slide-img {
      flex: 0 0 100%;
      scroll-snap-align: center;
      width: 100%;
      aspect-ratio: 16 / 9; /* Wide format */
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      background: #e2e8f0;
    }

    .modal-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .modal-desc {
      font-size: 1.1rem;
      color: #334155;
      line-height: 1.8;
      white-space: pre-line; /* Mendukung Enter/Line Break */
      margin-bottom: 40px;
    }
    .modal-link {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      color: white;
      text-decoration: none;
      padding: 15px 35px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 10px 20px rgba(79,70,229,0.3);
      transition: all 0.3s;
    }
    .modal-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(79,70,229,0.4);
    }
    
    /* Loading text */
    .loading-state { text-align: center; padding: 50px; color: var(--text-muted); font-size: 1.2rem; }
  </style>
</head>
<body>

<div class="container">
  <h1 class="page-title">Beranda Postingan</h1>
  
  <div class="grid" id="postsGrid">
    <div class="loading-state">⏳ Sedang memuat data terbaru...</div>
  </div>

  <div class="load-more-container" id="loadMoreContainer" style="display: none;">
    <button class="btn-load-more" onclick="loadMorePosts()">↓ Muat Lebih Banyak</button>
  </div>
</div>

<!-- ========================================= -->
<!-- MODAL FULL SCREEN UNTUK DETAIL POSTINGAN  -->
<!-- ========================================= -->
<div class="modal" id="postModal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-content">
    
    <!-- Slider Gambar Wide -->
    <div class="slider-container" id="modalSlider"></div>
    
    <h1 class="modal-title" id="modalTitle"></h1>
    <div class="modal-desc" id="modalDesc"></div>
    
    <a href="#" target="_blank" class="modal-link" id="modalLink" style="display: none;">🔗 Kunjungi Tautan</a>
  </div>
</div>

<script>
  let allPosts = [];
  let currentDisplayed = 0;
  const postsPerLoad = 9; // Maksimal 9 grid per klik

  // Jalankan saat halaman dibuka
  window.addEventListener('DOMContentLoaded', () => {
    fetchData();
  });

  async function fetchData() {
    try {
      const response = await fetch('./posts.json');
      if (!response.ok) throw new Error("File tidak ditemukan.");
      
      const data = await response.json();
      
      // Deteksi struktur JSON baru (Object {categories, posts}) atau yang lama (Array)
      if (data.posts && Array.isArray(data.posts)) {
        allPosts = data.posts;
      } else if (Array.isArray(data)) {
        allPosts = data;
      }

      document.getElementById('postsGrid').innerHTML = ""; // Bersihkan loading

      if (allPosts.length === 0) {
        document.getElementById('postsGrid').innerHTML = "<div class='loading-state'>Belum ada postingan.</div>";
        return;
      }

      loadMorePosts(); // Tampilkan 9 data pertama

    } catch (error) {
      console.error(error);
      document.getElementById('postsGrid').innerHTML = "<div class='loading-state'>Gagal memuat data.</div>";
    }
  }

  // Fungsi memuat kartu ke Grid
  function loadMorePosts() {
    const grid = document.getElementById('postsGrid');
    const end = Math.min(currentDisplayed + postsPerLoad, allPosts.length);

    for (let i = currentDisplayed; i < end; i++) {
      const post = allPosts[i];
      
      // Ambil array gambar (pisahkan dengan koma), hapus yg kosong
      const images = (post.gambar || "").split(',').map(s => s.trim()).filter(s => s !== "");
      
      // Ambil gambar pertama untuk thumbnail. Jika tidak ada, pakai gambar placeholder cantik
      const thumbnailSrc = images.length > 0 ? images[0] : "https://via.placeholder.com/600x400/e2e8f0/64748b?text=Tanpa+Gambar";
      const kategoriText = post.kategori || "Uncategorized";

      const cardHtml = `
        <div class="card" onclick="openModal(${i})">
          <div class="card-thumb-container">
            <span class="category-badge">${kategoriText}</span>
            <img src="${thumbnailSrc}" class="card-thumb" alt="Thumbnail" loading="lazy">
          </div>
          <div class="card-content">
            <h3 class="card-title">${post.judul}</h3>
            <span class="card-action-text">Klik untuk lihat detail <span>→</span></span>
          </div>
        </div>
      `;
      
      // Tambahkan kartu ke dalam Grid
      grid.insertAdjacentHTML('beforeend', cardHtml);
    }

    currentDisplayed = end;

    // Tampilkan atau sembunyikan tombol "Load More"
    const loadMoreBtn = document.getElementById('loadMoreContainer');
    if (currentDisplayed >= allPosts.length) {
      loadMoreBtn.style.display = 'none';
    } else {
      loadMoreBtn.style.display = 'block';
    }
  }

  // ==========================================
  // FUNGSI MODAL (POPUP FULL SCREEN)
  // ==========================================
  
  function openModal(index) {
    const post = allPosts[index];
    const modal = document.getElementById('postModal');
    
    // 1. Proses Slider Gambar
    const sliderContainer = document.getElementById('modalSlider');
    const images = (post.gambar || "").split(',').map(s => s.trim()).filter(s => s !== "");
    sliderContainer.innerHTML = "";
    
    if (images.length > 0) {
      images.forEach(imgUrl => {
        sliderContainer.innerHTML += `<img src="${imgUrl}" class="slide-img" loading="lazy">`;
      });
      sliderContainer.style.display = "flex";
    } else {
      sliderContainer.style.display = "none";
    }

    // 2. Proses Judul & Deskripsi
    document.getElementById('modalTitle').innerText = post.judul;
    document.getElementById('modalDesc').innerText = post.konten; // CSS pre-line otomatis handle Enter
    
    // 3. Proses Link Tombol
    const linkBtn = document.getElementById('modalLink');
    if (post.customLink && post.customLink.trim() !== "") {
      linkBtn.href = post.customLink;
      linkBtn.style.display = "inline-block";
    } else {
      linkBtn.style.display = "none";
    }

    // Tampilkan Modal
    modal.classList.add('show');
    document.body.style.overflow = "hidden"; // Kunci scroll background
  }

  function closeModal() {
    const modal = document.getElementById('postModal');
    modal.classList.remove('show');
    document.body.style.overflow = "auto"; // Buka kunci scroll background
  }

</script>
</body>
</html>
