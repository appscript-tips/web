<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Postingan Publik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- Header Rounded Super Cantik -->
  <div class="header-box">
    <h1 class="page-title">Apps Script Web App</h1>
    <p class="page-subtitle">Free copy spreadsheet</p>
  </div>

  <!-- Search & Category Pills Section -->
  <div class="filter-section">
    <div class="search-bar-wrapper">
      <div class="search-input-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari judul postingan...">
        <button id="clearSearchBtn" class="clear-search-btn" title="Hapus pencarian">✕</button>
      </div>
      <button id="searchBtn" class="search-btn">🔍 Cari</button>
    </div>
    
    <!-- Kategori Bulat Kecil Berjejer -->
    <div class="categories-bar" id="categoriesBar">
      <button class="cat-pill active" onclick="selectCategory('', this)">Semua</button>
    </div>

    <!-- Informasi Hasil Pencarian (Di bawah kategori) -->
    <div id="searchInfo" class="search-info-text" style="display: none;"></div>
  </div>
  
  <div class="grid" id="postsGrid">
    <div class="loading-state">⏳ Sedang memuat data terbaru...</div>
  </div>

  <div class="load-more-container" id="loadMoreContainer" style="display: none;">
    <button class="btn-load-more" onclick="loadMorePosts()">↓ Muat Lebih Banyak</button>
  </div>
</div>

<!-- ========================================= -->
<!-- MODAL FULL SCREEN                         -->
<!-- ========================================= -->
<div class="modal" id="postModal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  
  <div class="modal-content">
    <div class="slideshow-wrapper" id="slideshowWrapper" style="display: none;">
      <div class="slide-main-container" id="slideMainContainer"></div>
      <button class="slide-btn slide-prev" onclick="changeSlide(-1)">❮</button>
      <button class="slide-btn slide-next" onclick="changeSlide(1)">❯</button>
    </div>

    <div class="thumbnail-list" id="thumbnailList"></div>
    
    <h1 class="modal-title" id="modalTitle"></h1>
    <div class="modal-desc" id="modalDesc"></div>
    
    <!-- Container Tombol Aksi Lengkap -->
    <div class="modal-actions">
      <a href="#" target="_blank" class="modal-link" id="modalLink" style="display: none;">🔗 Kunjungi Tautan</a>
      
      <a href="#" target="_blank" class="btn-request-custom" id="requestCustomBtn">
        <svg class="wa-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        Request Custom
      </a>

      <a href="#" target="_blank" class="btn-tutorial" id="tutorialBtn" style="display: none;">
        <svg class="book-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Cara pasang/salin web app ini
      </a>
    </div>
  </div>
</div>

<!-- ========================================= -->
<!-- LIGHTBOX FULL SCREEN ZOOM (IMAGE VIEWER)  -->
<!-- ========================================= -->
<div class="lightbox-modal" id="lightboxModal">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div class="lightbox-img-container">
    <img id="lightboxImg" src="" alt="Zoom Preview">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
