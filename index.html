<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumpulan App Script Web App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- Header Rounded Super Cantik -->
  <div class="header-box">
    <h1 class="page-title">Apps Script Web App</h1>
    <p class="page-subtitle">Free copy spreadsheet</p>
  </div>

  <!-- Search & Category Pills Section -->
  <div class="filter-section">
    <div class="search-bar-wrapper">
      <div class="search-input-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari judul...">
        <button id="clearSearchBtn" class="clear-search-btn" title="Hapus pencarian">✕</button>
      </div>
      <button id="searchBtn" class="search-btn">🔍 Cari</button>
    </div>
    
    <!-- Kategori Bulat Kecil Berjejer -->
    <div class="categories-bar" id="categoriesBar">
      <button class="cat-pill active" onclick="selectCategory('', this)">Semua</button>
    </div>

    <!-- Informasi Hasil Pencarian (Di bawah kategori) -->
    <div id="searchInfo" class="search-info-text" style="display: none;"></div>
  </div>
  
  <div class="grid" id="postsGrid">
    <div class="loading-state">⏳ Sedang memuat data terbaru...</div>
  </div>

  <div class="load-more-container" id="loadMoreContainer" style="display: none;">
    <button class="btn-load-more" onclick="loadMorePosts()">↓ Muat Lebih Banyak</button>
  </div>
</div>

<!-- ========================================= -->
<!-- MODAL FULL SCREEN                         -->
<!-- ========================================= -->
<div class="modal" id="postModal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  
  <div class="modal-content">
    <div class="slideshow-wrapper" id="slideshowWrapper" style="display: none;">
      <div class="slide-main-container" id="slideMainContainer"></div>
      <button class="slide-btn slide-prev" onclick="changeSlide(-1)">❮</button>
      <button class="slide-btn slide-next" onclick="changeSlide(1)">❯</button>
    </div>

    <div class="thumbnail-list" id="thumbnailList"></div>
    
    <h1 class="modal-title" id="modalTitle"></h1>
    <div class="modal-desc" id="modalDesc"></div>
    
    <!-- Container Tombol Aksi Lengkap -->
    <div class="modal-actions">
      <!-- Tombol Kunjungi Tautan dengan Ikon Unduh Gradient SVG -->
<!-- Tombol Kunjungi Tautan dengan Logo dari Google Drive -->
      <a href="#" target="_blank" class="modal-link gradient-link" id="modalLink" style="display: none;">
        <img src="https://lh3.googleusercontent.com/d/1WOo9x17u79cQUgJLemnRoruOZh3N4p8T" alt="Link Icon" class="link-img-icon" width="18" height="18">
        Pasang WebApp Script ini
      </a>
      
      <!-- Tombol Request Custom dengan Logo WhatsApp dari Drive -->
      <a href="#" target="_blank" class="btn-request-custom" id="requestCustomBtn">
        <img src="https://lh3.googleusercontent.com/d/1Utk2XlBymeaVM__9VWyZMHb1spF_wOuO" alt="WhatsApp" class="wa-img-icon" width="18" height="18">
        Request Custom
      </a>

      <!-- Tombol Cara Pasang dengan Ikon Tanda Tanya (?) -->
      <a href="#" target="_blank" class="btn-tutorial" id="tutorialBtn" style="display: none;">
        <svg class="question-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        Cara pasang/salin web app ini
      </a>
    </div>
  </div>
</div>

<!-- ========================================= -->
<!-- LIGHTBOX FULL SCREEN ZOOM                 -->
<!-- ========================================= -->
<div class="lightbox-modal" id="lightboxModal">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div class="lightbox-img-container">
    <img id="lightboxImg" src="" alt="Zoom Preview">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
